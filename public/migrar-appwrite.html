<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migração Firebase -> Appwrite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f1f5f9;padding:24px;color:#0f172a}
.card{background:#fff;border-radius:16px;padding:28px;max-width:680px;margin:40px auto;box-shadow:0 8px 30px rgba(0,0,0,.1)}
h1{font-size:22px;margin-bottom:6px}
p{color:#475569;margin-bottom:20px;font-size:14px}
.btn{padding:12px 28px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:#dc2626;color:#fff}
.progress{margin:16px 0;background:#e2e8f0;border-radius:8px;overflow:hidden;height:28px}
.progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:8px;transition:width .3s;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:fit-content;padding:0 8px}
.log{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:16px;font-family:monospace;font-size:12px;max-height:320px;overflow-y:auto;margin-top:16px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stat-card{background:#f8fafc;border-radius:10px;padding:14px;text-align:center}
.stat-num{font-size:28px;font-weight:900;color:#2563eb}
.stat-label{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-top:3px}
.warning{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;font-size:13px;color:#92400e;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
<h1>🚚 Migrar Dados para Appwrite</h1>
<p>Este script vai ler todos os dados do Firebase Firestore e copiar para o Appwrite.</p>
<div class="warning">⚠ Importante: Nao feche esta pagina durante a migracao.</div>

<div class="stats">
<div class="stat-card"><div class="stat-num" id="stat-lidos">0</div><div class="stat-label">Lidos</div></div>
<div class="stat-card"><div class="stat-num" id="stat-escritos">0</div><div class="stat-label">Escritos</div></div>
<div class="stat-card"><div class="stat-num" id="stat-erros">0</div><div class="stat-label">Erros</div></div>
</div>

<div class="progress"><div class="progress-bar" id="progress-bar" style="width:0%">0%</div></div>

<div style="text-align:center;margin:16px 0">
<button class="btn btn-primary" id="btn-migrar" onclick="iniciarMigracao()">▶ Iniciar Migracao</button>
<button class="btn btn-danger" id="btn-limpar" onclick="limparAppwrite()" style="display:none">🗑 Limpar Appwrite</button>
</div>

<div class="log" id="log">ℹ Pronto. Clique em "Iniciar Migracao".</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<!-- Appwrite SDK -->
<script src="https://cdn.jsdelivr.net/npm/appwrite@14/dist/iife/sdk.js"></script>

<script>
// =====================================================
// CONFIGURACOES - NAO PRECISA ALTERAR
// =====================================================

// Firebase (projeto atual do usuario)
var FB_CONFIG = {
  apiKey: "AIzaSyACWjKTOzcxc0dt2TAeizKuQs-3_CdlhYE",
  authDomain: "gestaofacil-154f5.firebaseapp.com",
  projectId: "gestaofacil-154f5",
  storageBucket: "gestaofacil-154f5.firebasestorage.app",
  messagingSenderId: "367774228995",
  appId: "1:367774228995:web:240e91ede2c6b12110a436"
};

// Appwrite (novo projeto)
var AW_ENDPOINT = "https://nyc.cloud.appwrite.io/v1";
var AW_PROJECT_ID = "6a6fd97a000ecf1e1035";
var AW_DB_ID = "main";

// Mapeamento Firestore -> Appwrite
var COLECOES = [
  { fb: "companies",     aw: "companies" },
  { fb: "admin_config",  aw: "admin_config" },
  { fb: "sales",         aw: "sales" },
  { fb: "orders",        aw: "orders" },
  { fb: "chats",         aw: "chats" },
  { fb: "pub_customers", aw: "pub_customers" }
];

// =====================================================
// INICIALIZACAO
// =====================================================
firebase.initializeApp(FB_CONFIG);
var FDB = firebase.firestore();

var AWC = new Appwrite.Client();
AWC.setEndpoint(AW_ENDPOINT).setProject(AW_PROJECT_ID);
var AWD = new Appwrite.Databases(AWC);

// =====================================================
// CONTROLE
// =====================================================
var totalLidos = 0;
var totalEscritos = 0;
var totalErros = 0;

function logar(texto, tipo) {
  tipo = tipo || "info";
  var d = document.createElement("div");
  var cor;
  var icone;
  if (tipo === "ok") { cor = "#4ade80"; icone = "&#10003;"; }
  else if (tipo === "err") { cor = "#f87171"; icone = "&#10007;"; }
  else { cor = "#60a5fa"; icone = "&#9432;"; }
  d.innerHTML = '<span style="color:' + cor + '">' + icone + '</span> ' + texto;
  document.getElementById("log").appendChild(d);
  document.getElementById("log").scrollTop = document.getElementById("log").scrollHeight;
}

function atualizarStats() {
  document.getElementById("stat-lidos").textContent = totalLidos;
  document.getElementById("stat-escritos").textContent = totalEscritos;
  document.getElementById("stat-erros").textContent = totalErros;
}

function setProgresso(pct) {
  var bar = document.getElementById("progress-bar");
  bar.style.width = pct + "%";
  bar.textContent = Math.round(pct) + "%";
}

function pausar(ms) {
  return new Promise(function(r) { setTimeout(r, ms); });
}

// =====================================================
// MIGRAR UMA COLECAO
// =====================================================
async function migrarColecao(nomeFB, nomeAW, basePct, blocoPct) {
  logar('Lendo colecao "' + nomeFB + '"...');
  var docs;
  try {
    var snap = await FDB.collection(nomeFB).get();
    docs = snap.docs.map(function(d) { return { id: d.id, data: d.data() }; });
  } catch (e) {
    logar('ERRO ao ler ' + nomeFB + ': ' + e.message, "err");
    totalErros++;
    atualizarStats();
    return;
  }
  logar(docs.length + ' documento(s) encontrados', "ok");

  for (var i = 0; i < docs.length; i++) {
    var doc = docs[i];
    try {
      var limpo = JSON.parse(JSON.stringify(doc.data));
      await AWD.createDocument(AW_DB_ID, nomeAW, doc.id, limpo);
      totalEscritos++;
      logar('"' + doc.id.substring(0,20) + '" criado', "ok");
    } catch (e) {
      if (e.code === 409 || (e.message && e.message.indexOf("already exists") !== -1)) {
        try {
          await AWD.updateDocument(AW_DB_ID, nomeAW, doc.id, JSON.parse(JSON.stringify(doc.data)));
          totalEscritos++;
          logar('"' + doc.id.substring(0,20) + '" atualizado', "ok");
        } catch (e2) {
          totalErros++;
          logar('"' + doc.id.substring(0,20) + '" erro upd: ' + e2.message, "err");
        }
      } else {
        totalErros++;
        logar('"' + doc.id.substring(0,20) + '" erro: ' + e.message, "err");
      }
    }
    totalLidos++;
    atualizarStats();
    setProgresso(basePct + ((i + 1) / docs.length) * blocoPct);
    await pausar(80);
  }
  logar('Colecao "' + nomeFB + '" finalizada!', "ok");
}

// =====================================================
// INICIAR
// =====================================================
async function iniciarMigracao() {
  var btn = document.getElementById("btn-migrar");
  btn.disabled = true;
  btn.innerHTML = "⏳ Migrando...";
  document.getElementById("btn-limpar").style.display = "none";
  document.getElementById("log").innerHTML = "";

  totalLidos = 0;
  totalEscritos = 0;
  totalErros = 0;
  atualizarStats();
  setProgresso(0);

  var blocoPct = 100 / COLECOES.length;
  for (var idx = 0; idx < COLECOES.length; idx++) {
    var c = COLECOES[idx];
    await migrarColecao(c.fb, c.aw, idx * blocoPct, blocoPct);
    atualizarStats();
  }

  setProgresso(100);
  btn.innerHTML = "&#10003; Finalizado";
  document.getElementById("btn-limpar").style.display = "inline-flex";
  logar("MIGRACAO CONCLUIDA! " + totalEscritos + " escritos, " + totalErros + " erros.", "ok");
}

// =====================================================
// LIMPAR APPWRITE (caso precise refazer)
// =====================================================
async function limparAppwrite() {
  if (!confirm("Tem certeza? Vai apagar TODOS os dados do Appwrite.")) return;
  if (!confirm("ULTIMA CHANCE!")) return;

  var btn = document.getElementById("btn-limpar");
  btn.disabled = true;
  btn.innerHTML = "Limpando...";

  for (var idx = 0; idx < COLECOES.length; idx++) {
    var aw = COLECOES[idx].aw;
    logar("Limpando " + aw + "...");
    try {
      var cursor = null;
      var total = 0;
      while (true) {
        var queries = [Appwrite.Query.limit(100)];
        if (cursor) queries.push(Appwrite.Query.cursorAfter(cursor));
        var res = await AWD.listDocuments(AW_DB_ID, aw, queries);
        if (!res.documents || res.documents.length === 0) break;
        for (var j = 0; j < res.documents.length; j++) {
          await AWD.deleteDocument(AW_DB_ID, aw, res.documents[j].$id);
          total++;
          await pausar(50);
        }
        if (res.documents.length < 100) break;
        cursor = res.documents[res.documents.length - 1].$id;
      }
      logar(total + " docs removidos de " + aw, "ok");
    } catch (e) {
      logar("Erro ao limpar " + aw + ": " + e.message, "err");
    }
  }
  logar("Appwrite limpo. Pode refazer a migracao.", "ok");
  btn.innerHTML = "Limpar Appwrite";
  btn.disabled = false;
  document.getElementById("btn-migrar").disabled = false;
  document.getElementById("btn-migrar").innerHTML = "▶ Iniciar Migracao";
}
</script>
</body>
</html>
