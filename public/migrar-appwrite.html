
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migracao Firebase -> Appwrite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f1f5f9;padding:24px;color:#0f172a}
.card{background:#fff;border-radius:16px;padding:28px;max-width:680px;margin:40px auto;box-shadow:0 8px 30px rgba(0,0,0,.1)}
h1{font-size:22px;margin-bottom:6px}
p{color:#475569;margin-bottom:20px;font-size:14px}
.btn{padding:12px 28px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:#dc2626;color:#fff}
.progress{margin:16px 0;background:#e2e8f0;border-radius:8px;overflow:hidden;height:28px}
.progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .3s;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.log{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:16px;font-family:monospace;font-size:12px;max-height:320px;overflow-y:auto;margin-top:16px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stat-card{background:#f8fafc;border-radius:10px;padding:14px;text-align:center}
.stat-num{font-size:28px;font-weight:900;color:#2563eb}
.stat-label{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-top:3px}
.warning{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;font-size:13px;color:#92400e;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
<h1>🚚 Migrar Dados para Appwrite</h1>
<p>Este script vai ler todos os dados do Firebase Firestore e copiar para o Appwrite.</p>
<div class="warning">⚠ Importante: Nao feche esta pagina durante a migracao. Pode levar alguns minutos.</div>

<div class="stats">
<div class="stat-card"><div class="stat-num" id="stat-lidos">0</div><div class="stat-label">Lidos</div></div>
<div class="stat-card"><div class="stat-num" id="stat-escritos">0</div><div class="stat-label">Escritos</div></div>
<div class="stat-card"><div class="stat-num" id="stat-erros">0</div><div class="stat-label">Erros</div></div>
</div>

<div class="progress"><div class="progress-bar" id="progress-bar" style="width:0%">0%</div></div>

<div style="text-align:center;margin:16px 0">
<button class="btn" id="btn-migrar" onclick="iniciar()">▶ Iniciar Migracao</button>
<button class="btn btn-danger" id="btn-limpar" onclick="limpar()" style="display:none">🗑 Limpar Appwrite</button>
</div>

<div class="log" id="log">ℹ Pronto. Clique em "Iniciar Migracao".</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<!-- Appwrite SDK (CLIENT) -->
<script src="https://cdn.jsdelivr.net/npm/appwrite@14/dist/iife/sdk.js"></script>

<script>
// === CONFIG ===
firebase.initializeApp({
  apiKey: "AIzaSyACWjKTOzcxc0dt2TAeizKuQs-3_CdlhYE",
  authDomain: "gestaofacil-154f5.firebaseapp.com",
  projectId: "gestaofacil-154f5",
  storageBucket: "gestaofacil-154f5.firebasestorage.app",
  messagingSenderId: "367774228995",
  appId: "1:367774228995:web:240e91ede2c6b12110a436"
});
var FDB = firebase.firestore();

var AWC = new Appwrite.Client();
AWC.setEndpoint("https://nyc.cloud.appwrite.io/v1").setProject("6a6fd97a000ecf1e1035");
var AWD = new Appwrite.Databases(AWC);
var AW_DB = "main";

var COLECOES = [
  {fb:"companies",aw:"companies"},
  {fb:"admin_config",aw:"admin_config"},
  {fb:"sales",aw:"sales"},
  {fb:"orders",aw:"orders"},
  {fb:"chats",aw:"chats"},
  {fb:"pub_customers",aw:"pub_customers"}
];

var lidos=0,escritos=0,erros=0;

function log(txt,tp) {
  tp=tp||"info";
  var d=document.createElement("div");
  var cor = tp==="ok"?"#4ade80":tp==="err"?"#f87171":"#60a5fa";
  var ic = tp==="ok"?"✓":tp==="err"?"✗":"ℹ";
  d.innerHTML='<span style="color:'+cor+'">'+ic+'</span> '+txt;
  document.getElementById("log").appendChild(d);
  document.getElementById("log").scrollTop=document.getElementById("log").scrollHeight;
}
function stats() {
  document.getElementById("stat-lidos").textContent=lidos;
  document.getElementById("stat-escritos").textContent=escritos;
  document.getElementById("stat-erros").textContent=erros;
}
function pct(n) {
  var b=document.getElementById("progress-bar");
  b.style.width=n+"%";
  b.textContent=Math.round(n)+"%";
}

async function escreverDoc(nomeAW,id,data,tentativa) {
  try {
    await AWD.createDocument(AW_DB,nomeAW,id,data);
    return true;
  } catch(e) {
    if(e.code===409||(e.message||'').indexOf("already exists")!==-1){
      try {
        await AWD.updateDocument(AW_DB,nomeAW,id,data);
        return true;
      } catch(e2){ return false; }
    }
    if((e.message||'').indexOf("Rate limit")!==-1 && tentativa<5){
      var espera = Math.pow(2,tentativa+1)*2000; // 4s, 8s, 16s, 32s, 64s
      log("⏳ rate limit, aguardando "+(espera/1000)+"s... (tentativa "+(tentativa+1)+")");
      await new Promise(function(r){setTimeout(r,espera);});
      return await escreverDoc(nomeAW,id,data,tentativa+1);
    }
    return false;
  }
}

async function migrarColecao(nomeFB,nomeAW,basePct,bloco) {
  log('Lendo "'+nomeFB+'"...');
  var snap;
  try { snap = await FDB.collection(nomeFB).get(); }
  catch(e) { log('ERRO ao ler: '+e.message,'err'); erros++; return; }
  var docs = snap.docs.map(function(d){return {id:d.id,data:d.data()};});
  log(docs.length+' documento(s) encontrados','ok');
  if(docs.length===0) return;

  for(var i=0;i<docs.length;i++){
    var d=docs[i];
    var ok = await escreverDoc(nomeAW,d.id,d.data,0);
    if(ok) escritos++; else erros++;
    lidos++;
    stats();
    pct(basePct+((i+1)/docs.length)*bloco);
    await new Promise(function(r){setTimeout(r,2000);});
  }
  log('"'+(nomeFB)+'" concluida!','ok');
}

async function iniciar() {
  var btn=document.getElementById("btn-migrar");
  btn.disabled=true;
  btn.textContent="⏳ Migrando...";
  document.getElementById("btn-limpar").style.display="none";
  document.getElementById("log").innerHTML="";
  lidos=0;escritos=0;erros=0;stats();pct(0);

  var bloco=100/COLECOES.length;
  for(var i=0;i<COLECOES.length;i++){
    var c=COLECOES[i];
    await migrarColecao(c.fb,c.aw,i*bloco,bloco);
  }
  pct(100);
  btn.textContent="✓ Finalizado";
  document.getElementById("btn-limpar").style.display="inline";
  log("MIGRACAO CONCLUIDA! "+escritos+" escritos, "+erros+" erros.","ok");
}
</script>
</body>
</html>
