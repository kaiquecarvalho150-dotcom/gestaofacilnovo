<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gestão Fácil</title>
<style>
body{font-family: Arial; margin: 40px; text-align: center;}
.btn{background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;}
</style>
</head>
<body>
<h1>Gestão Fácil</h1>
<p>Sistema em manutenção. Volte em breve.</p>
<button class="btn" onclick="testarAPI()">Testar API</button>
<script>
async function testarAPI() {
    try {
        const res = await fetch('/api/login');
        const data = await res.json();
        alert('API respondeu: ' + JSON.stringify(data));
    } catch(e) {
        alert('Erro: ' + e.message);
    }
}
</script>
</body>
</html>
